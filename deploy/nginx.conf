server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100m;

    # ---- 접근 제어 ----------------------------------------------------------
    # 사내망(사설 IP) · Tailscale(100.64.0.0/10) → 로그인 없이 열람.
    # 그 외 출처(공개 인터넷 터널 등) → Basic 인증 요구 (안전망).
    #   계정/비번: deploy/PASSWORD.txt   ·   비번파일: deploy/htpasswd
    satisfy any;
    allow 127.0.0.0/8;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;      # Docker 브리지 게이트웨이 포함
    allow 192.168.0.0/16;     # 사내망
    allow 100.64.0.0/10;      # Tailscale
    deny  all;
    auth_basic           "TS본부 운영 대시보드";
    auth_basic_user_file /etc/nginx/htpasswd;

    proxy_set_header X-Remote-User $remote_user;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        add_header Cache-Control "no-store" always;
    }

    # index.html 은 매번 재검증(브라우저가 옛 화면을 붙잡지 않도록)
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
